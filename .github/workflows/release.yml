name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing v* tag to publish (leave empty for a build-only run)"
        required: false
        type: string

permissions:
  contents: read

env:
  CGO_ENABLED: '0'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Validate release tag
        if: inputs.release_tag != ''
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          case "$RELEASE_TAG" in
            v*) ;;
            *) echo "Release tag must start with v." >&2; exit 1 ;;
          esac
          git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}"

      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'

      - name: Check Go formatting
        shell: bash
        run: test -z "$(gofmt -l cmd internal)"

      - name: Check Go source and regression tests
        run: |
          go vet ./...
          go test ./...

  build:
    needs: check
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            goos: linux
            goarch: amd64
            asset: poke-linux-x86_64
          - runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            asset: poke-linux-aarch64
          - runner: macos-15-intel
            goos: darwin
            goarch: amd64
            asset: poke-darwin-x86_64
          - runner: macos-15
            goos: darwin
            goarch: arm64
            asset: poke-darwin-aarch64
          - runner: windows-latest
            goos: windows
            goarch: amd64
            asset: poke-windows-x86_64.exe
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'

      - name: Build ${{ matrix.asset }}
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-s -w" -o dist/${{ matrix.asset }} ./cmd/poke

      - name: Test on matching platform, including executable smoke tests
        env:
          POKE_TEST_BINARY: ${{ github.workspace }}/dist/${{ matrix.asset }}
        run: go test ./...

      - name: Upload ${{ matrix.asset }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error
          compression-level: 0

  release:
    if: github.ref_type == 'tag' || inputs.release_tag != ''
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download executables
        uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Create checksums
        working-directory: dist
        run: sha256sum poke-* > SHA256SUMS

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          files: dist/*
          generate_release_notes: true
